# Build for the BPF target and bring our own `core` (no prebuilt std for BPF), so a
# plain `cargo build` inside this directory produces the eBPF object. Requires the
# nightly pinned in rust-toolchain.toml.
[build]
target = "bpfel-unknown-none"
# BTF carries the func_info the kernel requires for bpf_loop callbacks.
rustflags = ["-C", "debuginfo=2", "-C", "link-arg=--btf"]

[unstable]
build-std = ["core"]
