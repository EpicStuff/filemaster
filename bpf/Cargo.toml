[workspace]
members = [
	'filemaster-lsm',
	'filemaster-lsm-common',
]
resolver = '3'

[workspace.package]
version = '0.0.0'
edition = '2024'
license = 'Apache-2.0'
repository = 'https://github.com/EpicStuff/filemaster'
rust-version = '1.95'

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
panic = 'abort'
codegen-units = 1
