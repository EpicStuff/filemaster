<span class="text-secondary text-xxs">{{ event.at | date:'HH:mm:ss' }}</span>
<span *ngIf="showAppColumn" class="overflow-hidden text-ellipsis" [title]="event.app_name || event.exe">{{ event.app_name || event.exe }}</span>
<span class="uppercase text-xxs font-mono" [ngClass]="opClass">{{ event.op }}</span>
<span class="text-xxs" [ngClass]="verdictClass">{{ event.verdict }}</span>
<span class="text-secondary overflow-hidden text-ellipsis" [title]="event.path">{{ event.path }}</span>
