<div class="sticky top-0 z-50 bg-background pb-2" *ngIf="activeFilters.length">
	<div class="flex flex-row flex-wrap items-center gap-2 p-2 bg-gray-300 rounded text-xxs">
		<span class="text-secondary uppercase font-medium">Filters:</span>
		<span
			*ngFor="let f of activeFilters"
			class="flex items-center gap-1 px-2 py-0.5 bg-gray-400 rounded cursor-pointer hover:bg-gray-500"
			(click)="removeFilter(f)">
			<span class="text-secondary">{{ f.label }}:</span>
			<span class="text-primary">{{ f.value }}</span>
			<span class="ml-1 text-tertiary hover:text-red-400">×</span>
		</span>
		<button
			class="bg-transparent hover:bg-transparent ml-auto cursor-pointer text-tertiary hover:text-primary p-0"
			(click)="clearFilters()">
			Clear All
		</button>
	</div>
</div>

<div class="flex flex-row items-center w-full gap-2">
	<input
		type="text"
		[(ngModel)]="textSearch"
		(ngModelChange)="performSearch()"
		placeholder="Search by app, path, or exe…"
		class="block w-full px-3 py-2 text-sm bg-gray-300 border border-gray-400 rounded focus:outline-none focus:border-primary" />
	<button type="button" class="h-full px-4 py-2 rounded btn" (click)="reload()">Reload</button>
</div>

<div class="flex flex-row flex-wrap items-center gap-2 text-xxs">
	<span class="text-secondary">Filter by:</span>
	<button
		*ngFor="let op of ['open', 'read', 'write', 'exec']"
		class="px-2 py-0.5 rounded border border-gray-500 hover:border-primary hover:text-primary transition-colors"
		(click)="addFilter('op', op)">
		{{ op }}
	</button>
	<span class="text-gray-500">|</span>
	<button
		class="px-2 py-0.5 rounded border border-green-600 text-green-400 hover:bg-green-900 transition-colors"
		(click)="addFilter('verdict', 'allow')">
		allow
	</button>
	<button
		class="px-2 py-0.5 rounded border border-red-600 text-red-400 hover:bg-red-900 transition-colors"
		(click)="addFilter('verdict', 'deny')">
		deny
	</button>
</div>

<div class="relative flex-grow overflow-auto">
	<div *ngIf="loading && !events.length" class="flex items-center justify-center py-10 text-secondary">
		Loading…
	</div>

	<table *ngIf="events.length" class="w-full text-sm border-collapse">
		<thead class="sticky top-0 bg-gray-200 text-left z-10">
			<tr>
				<th class="px-3 py-2 font-medium text-secondary text-xxs uppercase">Time</th>
				<th class="px-3 py-2 font-medium text-secondary text-xxs uppercase">App</th>
				<th class="px-3 py-2 font-medium text-secondary text-xxs uppercase">Op</th>
				<th class="px-3 py-2 font-medium text-secondary text-xxs uppercase">Verdict</th>
				<th class="px-3 py-2 font-medium text-secondary text-xxs uppercase">Path</th>
			</tr>
		</thead>
		<tbody>
			<tr
				*ngFor="let event of events"
				app-file-event-row
				[event]="event"
				class="border-t border-gray-800 hover:bg-gray-300 transition-colors cursor-pointer"
				(click)="addFilter('app_name', event.app_name || event.exe)">
			</tr>
		</tbody>
	</table>

	<div *ngIf="!loading && !events.length" class="flex items-center justify-center py-10 text-secondary text-sm">
		No file-access events recorded yet.
	</div>

	<div *ngIf="hasMore" class="flex justify-center py-4">
		<button class="btn" (click)="loadMore()" [disabled]="loading">
			{{ loading ? 'Loading…' : 'Load more' }}
		</button>
	</div>
</div>
